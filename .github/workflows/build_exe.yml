name: Build VisionStudio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Add the built-in Vision Browser (optional)
        shell: pwsh
        run: |
          # The Vision Browser needs Qt WebEngine at exactly the same Qt version as the rest of Qt (and the matching
          # PyQt6). If it cannot be added, everything is put back and the program still builds; its Conference Call
          # page then says the Vision Browser is missing.
          function Get-Ver($name) { ((pip show $name) | Select-String '^Version:').Line.Split(':')[1].Trim() }
          $origPy = Get-Ver "PyQt6"
          $origCore = Get-Ver "PyQt6-Qt6"
          try {
            pip install "PyQt6-WebEngine>=6.7,<6.13" "PyQt6-WebEngine-Qt6>=6.7,<6.13"
            if ($LASTEXITCODE -ne 0) { throw "pip could not install the browser engine" }
            $web = Get-Ver "PyQt6-WebEngine-Qt6"
            $parts = $web.Split('.')
            $low = "$($parts[0]).$($parts[1])"
            $high = "$($parts[0]).$([int]$parts[1] + 1)"
            Write-Host "Qt WebEngine $web; PyQt6 was $origPy and Qt core $origCore"
            pip install "PyQt6>=$low,<$high" "PyQt6-Qt6==$web" "PyQt6-WebEngine-Qt6==$web" "PyQt6-WebEngine>=$low,<$high"
            if ($LASTEXITCODE -ne 0) { throw "Qt WebEngine $web could not be matched with PyQt6 and Qt core" }
            $probe = python -c "from PyQt6.QtCore import QT_VERSION_STR; print(QT_VERSION_STR); from PyQt6.QtWebEngineWidgets import QWebEngineView; from PyQt6.QtWebEngineCore import QWebEngineProfile; print('browser engine ok')" 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "the browser engine would not load: $probe" }
            "VS_WEBENGINE=1" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "::notice title=Vision Browser::browser engine added, Qt $web"
          } catch {
            $versions = (pip freeze | Select-String "Qt") -join "; "
            $msg = (($_ | Out-String) + " Installed: " + $versions) -replace "`r", "" -replace "`n", "%0A"
            Write-Host "::warning title=Vision Browser missing::$msg"
            pip install "PyQt6==$origPy" "PyQt6-Qt6==$origCore"
          }
          # This step is optional: a failed browser check must not fail the build.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Check the toolkit still supports Windows 10
        shell: pwsh
        run: |
          pip freeze
          $qt = python -c "from PyQt6.QtCore import QT_VERSION_STR; print(QT_VERSION_STR)"
          Write-Host "Qt version: $qt"
          $parts = $qt.Trim().Split('.')
          if ([int]$parts[0] -gt 6 -or ([int]$parts[0] -eq 6 -and [int]$parts[1] -ge 13)) {
            Write-Error "Qt $qt does not run on Windows 10. Vision Studio keeps Windows 10 support until about October 2028."
            exit 1
          }

      - name: Download FFmpeg (bundled into the app)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extract -Force
          $exe = Get-ChildItem -Path ffmpeg_extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName ffmpeg\ffmpeg.exe
          .\ffmpeg\ffmpeg.exe -version

      - name: Make the program icon
        run: |
          python VisionStudio.py --make-icon VisionStudio.ico

      - name: Build the conference-call audio helper (optional)
        id: helper
        continue-on-error: true
        shell: pwsh
        run: |
          # Captures one program's sound (Zoom and so on) without a virtual audio cable. If this step ever fails,
          # the program still builds; the Conference Call settings page then says the helper is missing.
          try {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vs) { throw "Visual Studio build tools were not found" }
            $out = cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /EHsc /O2 /W3 helper\vs_appcapture.cpp /Fe:helper\vs_appcapture.exe /link ole32.lib mmdevapi.lib 2>&1" | Out-String
            Write-Host $out
            if (-not (Test-Path helper\vs_appcapture.exe)) { throw ("The helper did not compile: " + $out) }
            Write-Host "::notice title=Conference helper::compiled, $((Get-Item helper\vs_appcapture.exe).Length) bytes"
          } catch {
            $msg = ($_ | Out-String)
            if ($msg.Length -gt 1500) { $msg = $msg.Substring(0, 1500) }
            $msg = $msg -replace "`r", "" -replace "`n", "%0A"
            Write-Host "::warning title=Conference helper failed::$msg"
          }

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path helper\vs_appcapture.exe) { $extra += @("--add-binary", "helper\vs_appcapture.exe;helper") } else { Write-Host "Building without the conference-call helper." }
          if ($env:VS_WEBENGINE -eq "1") { $extra += @("--hidden-import", "PyQt6.QtWebEngineWidgets", "--hidden-import", "PyQt6.QtWebEngineCore") } else { Write-Host "Building without the Vision Browser." }
          pyinstaller --noconfirm --onefile --windowed --icon VisionStudio.ico --add-binary "ffmpeg\ffmpeg.exe;ffmpeg" @extra VisionStudio.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VisionStudio-App
          path: dist/VisionStudio.exe

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { throw "Inno Setup was not installed" }

      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" VisionStudio.iss
          Get-ChildItem installer

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: VisionStudio-Installer
          path: installer/VisionStudioSetup.exe
